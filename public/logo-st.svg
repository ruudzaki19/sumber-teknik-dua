<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Gear with 12 Teeth -->
  <g fill="url(#gearGrad)" filter="url(#shadow)">
    <!-- Central Disc -->
    <circle cx="60" cy="60" r="46" />
    <!-- 12 Teeth around circle -->
    <!-- 0 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" />
    <!-- 30 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(30 60 60)" />
    <!-- 60 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(60 60 60)" />
    <!-- 90 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(90 60 60)" />
    <!-- 120 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(120 60 60)" />
    <!-- 150 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(150 60 60)" />
    <!-- 180 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(180 60 60)" />
    <!-- 210 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(210 60 60)" />
    <!-- 240 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(240 60 60)" />
    <!-- 270 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(270 60 60)" />
    <!-- 300 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(300 60 60)" />
    <!-- 330 deg -->
    <rect x="52" y="6" width="16" height="14" rx="3" transform="rotate(330 60 60)" />
  </g>
  
  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" />

  <!-- Inner Hub White Circle -->
  <circle cx="60" cy="60" r="32" fill="#ffffff" stroke="#166534" stroke-width="3" />
  
  <!-- Text ST -->
  <text x="60" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="28" fill="#15803d" text-anchor="middle" letter-spacing="-1">ST</text>
  
  <!-- Small Two Dot Accents representing "Dua" -->
  <circle cx="48" cy="78" r="2.5" fill="#15803d" />
  <circle cx="72" cy="78" r="2.5" fill="#15803d" />
</svg>
